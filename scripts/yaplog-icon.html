<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      @font-face {
        font-family: "Space Mono";
        font-style: normal;
        font-weight: 700;
        src: url("../node_modules/@fontsource/space-mono/files/space-mono-latin-700-normal.woff2")
          format("woff2");
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 512px;
        height: 512px;
        margin: 0;
        overflow: hidden;
        background: #0f0f0f;
      }

      body {
        display: grid;
        place-items: center;
      }

      .brand {
        color: #f8f8f8;
        font-family: "Space Mono", monospace;
        font-size: 86px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0;
        text-decoration-line: underline;
        text-decoration-style: double;
        text-decoration-color: #f8f8f8;
        text-decoration-thickness: 5px;
        text-underline-offset: 14px;
      }
    </style>
  </head>
  <body>
    <div class="brand">YapLog</div>
  </body>
</html>
